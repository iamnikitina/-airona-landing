# Деплой aironaai.ru рядом с airona-ai.ru (вебинарным) на том же droplet'е
# Использует существующий Traefik из стека n8n-compose
# Запуск: docker compose -f deploy/docker-compose.yml up -d

name: aironaai-landing

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      # Файлы сайта (всё из корня репо, кроме deploy/)
      - ../assets:/usr/share/nginx/html/assets:ro
      - ../pay:/usr/share/nginx/html/pay:ro
      - ../index.html:/usr/share/nginx/html/index.html:ro
      # Кастомный конфиг nginx внутри контейнера
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n-compose_default

      # HTTPS router for aironaai.ru and www.aironaai.ru
      - "traefik.http.routers.aironaai.rule=Host(`aironaai.ru`) || Host(`www.aironaai.ru`)"
      - traefik.http.routers.aironaai.entrypoints=websecure
      - traefik.http.routers.aironaai.tls=true
      - traefik.http.routers.aironaai.tls.certresolver=mytlschallenge
      - traefik.http.services.aironaai.loadbalancer.server.port=80

      # www → apex redirect
      - traefik.http.middlewares.aironaai-www-redirect.redirectregex.permanent=true
      - "traefik.http.middlewares.aironaai-www-redirect.redirectregex.regex=^https?://www\\.aironaai\\.ru/(.*)"
      - traefik.http.middlewares.aironaai-www-redirect.redirectregex.replacement=https://aironaai.ru/$$1
      - traefik.http.routers.aironaai.middlewares=aironaai-www-redirect

networks:
  traefik:
    external: true
    name: n8n-compose_default
