server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Длинный кеш для статики
    location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Pretty URLs: /pay/success → /pay/success/index.html
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/html text/plain text/xml application/javascript application/json image/svg+xml;

    # access_log /var/log/nginx/access.log;
    # error_log  /var/log/nginx/error.log warn;
}
