# Положить в /etc/nginx/sites-available/aironaai.ru
# Активировать: ln -s /etc/nginx/sites-available/aironaai.ru /etc/nginx/sites-enabled/
# Проверить: nginx -t
# Применить: systemctl reload nginx

# HTTP → HTTPS редирект (включится после certbot)
server {
    listen 80;
    listen [::]:80;
    server_name aironaai.ru www.aironaai.ru;

    # Для Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (certbot допишет ssl_certificate/ssl_certificate_key)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aironaai.ru www.aironaai.ru;

    root /var/www/aironaai;
    index index.html;

    # Логи
    access_log /var/log/nginx/aironaai.access.log;
    error_log  /var/log/nginx/aironaai.error.log warn;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Статика с длинным кешем
    location ~* \.(?:css|js|woff2?|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:png|jpe?g|webp|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # /pay/success и /pay/fail отдаются как /pay/success/index.html и т.п.
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/html text/plain text/xml application/javascript application/json image/svg+xml;
}
